<div class="docs-login-page">
  <div class="docs-login-card">
    <div class="docs-login-icon">📖</div>
    <h1>Acceso a la documentación</h1>
    <p class="docs-login-sub">Inicia sesión con tu cuenta Dairi para continuar.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="docs-login-form">
      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" autocomplete="username"
               [class.invalid]="isInvalid('email')" placeholder="tu@correo.com" />
        <span class="field-error" *ngIf="isInvalid('email')">Ingresa un correo válido.</span>
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input [id]="'password'" [type]="showPass() ? 'text' : 'password'" formControlName="password"
                 autocomplete="current-password" [class.invalid]="isInvalid('password')" placeholder="••••••••" />
          <button type="button" class="toggle-pass" (click)="togglePass()" tabindex="-1">
            {{ showPass() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <span class="field-error" *ngIf="isInvalid('password')">La contraseña es requerida.</span>
      </div>

      <div class="form-error" *ngIf="error()">{{ error() }}</div>

      <button type="submit" class="submit-btn" [disabled]="loading()">
        {{ loading() ? 'Ingresando…' : 'Ingresar a la documentación' }}
      </button>
    </form>

    <a routerLink="/" class="back-link">← Volver al inicio</a>
  </div>
</div>
